<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anecdote Description Extractor</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f0e0d;
      background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,200,80,0.07) 0%, transparent 60%);
      font-family: 'Lora', Georgia, serif;
      padding: 40px 20px 60px;
      color: rgba(255,255,255,0.9);
    }
    textarea { resize: vertical; }
    textarea::placeholder { color: rgba(255,255,255,0.18); }
    textarea:focus { outline: none; border-color: rgba(255,200,80,0.35) !important; box-shadow: 0 0 0 3px rgba(255,200,80,0.05); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    .header { text-align: center; margin-bottom: 36px; }
    .badge {
      display: inline-block; font-size: 10px; font-family: 'DM Mono', monospace;
      letter-spacing: 0.2em; color: rgba(255,200,80,0.6); text-transform: uppercase;
      margin-bottom: 12px; background: rgba(255,200,80,0.07);
      padding: 4px 14px; border-radius: 20px; border: 1px solid rgba(255,200,80,0.15);
    }
    h1 { font-size: clamp(26px,5vw,40px); font-weight: 600; color: rgba(255,255,255,0.92); line-height: 1.2; }
    h1 span { color: rgba(255,200,80,0.85); }
    .subtitle { margin-top: 12px; color: rgba(255,255,255,0.3); font-size: 13px; font-family: 'DM Mono', monospace; }
    .main { max-width: 760px; margin: 0 auto 32px; }
    textarea.input {
      width: 100%; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
      padding: 18px 20px; color: rgba(255,255,255,0.82);
      font-size: 14px; line-height: 1.7; font-family: 'Lora', Georgia, serif;
      transition: border-color 0.2s;
    }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .left { display: flex; gap: 8px; }
    .icon-btn {
      border: 1px solid rgba(255,200,80,0.2); border-radius: 8px;
      background: rgba(255,200,80,0.07); color: rgba(255,200,80,0.55);
      cursor: pointer; padding: 7px 11px; font-size: 13px;
      font-family: 'DM Mono', monospace; display: flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: rgba(255,200,80,0.15); color: rgba(255,200,80,0.9); border-color: rgba(255,200,80,0.35); }
    .go-btn {
      background: rgb(255,200,80); border: none; border-radius: 10px;
      color: #1a1500; cursor: pointer; width: 42px; height: 38px;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0;
    }
    .go-btn:disabled { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.2); cursor: not-allowed; }
    .go-btn:not(:disabled):hover { background: rgb(255,215,100); }
    .batches { max-width: 760px; margin: 0 auto; }
    .batch {
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 20px 20px 18px; margin-bottom: 16px;
    }
    .batch-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .batch-label { font-size: 10px; font-family: 'DM Mono', monospace; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,200,80,0.55); }
    .close-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px; color: rgba(255,255,255,0.35); cursor: pointer;
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; line-height: 1; transition: all 0.15s; padding: 0;
    }
    .close-btn:hover { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.3); color: rgba(255,120,120,0.9); }
    .cards { display: flex; flex-direction: column; gap: 8px; }
    .card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 7px;
      position: relative; transition: border-color 0.2s;
    }
    .card:hover { border-color: rgba(255,200,80,0.25); }
    .card-num { position: absolute; top: 10px; left: 13px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; color: rgba(255,200,80,0.4); font-family: 'DM Mono', monospace; }
    .card-first {
      margin: 0 0 0 26px; font-size: 11.5px; line-height: 1.5;
      color: rgba(255,255,255,0.28); font-style: italic; font-family: 'Lora', Georgia, serif;
      padding-right: 32px; overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    }
    .divider { height: 1px; background: linear-gradient(90deg, rgba(255,200,80,0.15), transparent); margin: 1px 0; }
    .card-bottom { display: flex; align-items: flex-start; gap: 10px; }
    .card-desc { margin: 0; flex: 1; font-size: 13.5px; line-height: 1.55; color: rgba(255,255,255,0.9); font-family: 'Lora', Georgia, serif; font-weight: 500; }
    .copy-btn {
      flex-shrink: 0; margin-top: 1px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px; color: rgba(255,255,255,0.4); cursor: pointer;
      padding: 5px 7px; display: flex; align-items: center; gap: 4px;
      font-size: 10px; font-family: 'DM Mono', monospace; transition: all 0.15s;
    }
    .copy-btn:hover { background: rgba(255,200,80,0.1); color: rgba(255,200,80,0.8); border-color: rgba(255,200,80,0.3); }
    .copy-btn.copied { background: rgba(255,200,80,0.15); border-color: rgba(255,200,80,0.4); color: rgb(255,200,80); }
    .footer-note { text-align: center; margin-top: 8px; font-size: 10px; font-family: 'DM Mono', monospace; color: rgba(255,255,255,0.15); letter-spacing: 0.08em; }
  </style>
</head>
<body>

<div class="header">
  <div class="badge">Joke Parser</div>
  <h1>Anecdote Description<br><span>Extractor</span></h1>
  <p class="subtitle">Paste jokes → extract → copy descriptions with hashtags</p>
</div>

<div class="main">
  <textarea class="input" id="input" rows="10" placeholder="Paste your anecdotes here..."></textarea>
  <div class="toolbar">
    <div class="left">
      <button class="icon-btn" onclick="handlePaste()" title="Paste">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="handleClear()" title="Clear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <button class="go-btn" id="goBtn" onclick="handleExtract()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>
</div>

<div class="batches" id="batches"></div>

<script>
const HASHTAGS = "#anecdote #jokes #humor";
let batches = [];

// FIXED: split by --- first so short jokes are never skipped
function parseJokes(raw) {
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  // Split by --- (primary format)
  let segments = raw.split(/\s*\n\s*---\s*\n\s*/).map(s => s.trim()).filter(Boolean);

  // Fallback: blank-line separated (old format)
  if (segments.length <= 1) {
    segments = raw.trim().split(/\n[ \t]*\n/).map(s => s.trim()).filter(Boolean);
  }

  const jokes = [];
  for (const seg of segments) {
    const lines = seg.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;

    // Find *description* — last line wrapped in asterisks
    let descIdx = -1;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (/^\*.+\*$/.test(lines[i])) { descIdx = i; break; }
    }

    let description, firstLine;
    if (descIdx !== -1) {
      description = lines[descIdx].replace(/^\*|\*$/g, '').trim();
      firstLine   = lines.find((_, i) => i !== descIdx) || lines[0];
    } else {
      description = lines[lines.length - 1];
      firstLine   = lines[0];
    }

    if (description && firstLine) jokes.push({ firstLine, description });
  }
  return jokes;
}

function render() {
  const container = document.getElementById('batches');
  if (batches.length === 0) { container.innerHTML = ''; return; }
  let html = '';
  batches.forEach((batch, bi) => {
    html += `<div class="batch">
      <div class="batch-header">
        <span class="batch-label">Batch ${String(bi+1).padStart(2,'0')} · ${batch.length} joke${batch.length!==1?'s':''}</span>
        <button class="close-btn" onclick="removeBatch(${bi})">×</button>
      </div>
      <div class="cards">`;
    batch.forEach((joke, ji) => {
      const id = `copy-${bi}-${ji}`;
      html += `<div class="card">
        <span class="card-num">${String(ji+1).padStart(2,'0')}</span>
        <p class="card-first">${esc(joke.firstLine)}…</p>
        <div class="divider"></div>
        <div class="card-bottom">
          <p class="card-desc">${esc(joke.description)}</p>
          <button class="copy-btn" id="${id}" onclick="copyDesc(${bi},${ji},'${id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy
          </button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `<p class="footer-note">Copies: description + ${HASHTAGS}</p>`;
  container.innerHTML = html;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function removeBatch(i) { batches.splice(i,1); render(); }

function copyDesc(bi, ji, btnId) {
  const text = batches[bi][ji].description + ' ' + HASHTAGS;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
    }, 2000);
  });
}

async function handlePaste() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('input').value = text;
    updateBtn();
  } catch { document.getElementById('input').focus(); }
}

function handleClear() { document.getElementById('input').value = ''; updateBtn(); }

function handleExtract() {
  const val = document.getElementById('input').value;
  if (!val.trim()) return;
  const result = parseJokes(val);
  if (!result.length) return;
  batches.push(result);
  render();
  document.getElementById('input').value = '';
  updateBtn();
}

function updateBtn() {
  document.getElementById('goBtn').disabled = !document.getElementById('input').value.trim();
}

document.getElementById('input').addEventListener('input', updateBtn);
</script>
</body>
</html>
