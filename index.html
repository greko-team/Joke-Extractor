<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anecdote Image Maker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  @font-face{font-family:'CalSans';src:url('data:font/truetype;base64,__FONT__') format('truetype');font-weight:normal;}
  body{min-height:100vh;background:#0f0e0d;background-image:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(255,200,80,0.07) 0%,transparent 60%);font-family:Georgia,serif;padding:36px 16px 60px;color:rgba(255,255,255,0.9);}
  textarea::placeholder{color:rgba(255,255,255,0.18);}
  textarea:focus{outline:none;border-color:rgba(255,200,80,0.35)!important;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px;}
  .header{text-align:center;margin-bottom:32px;}
  .badge{display:inline-block;font-size:10px;font-family:monospace;letter-spacing:.2em;color:rgba(255,200,80,.6);text-transform:uppercase;margin-bottom:12px;background:rgba(255,200,80,.07);padding:4px 14px;border-radius:20px;border:1px solid rgba(255,200,80,.15);}
  h1{font-size:clamp(24px,5vw,36px);font-weight:600;color:rgba(255,255,255,.92);line-height:1.2;}
  h1 span{color:rgba(255,200,80,.85);}
  .subtitle{margin-top:10px;color:rgba(255,255,255,.3);font-size:12px;font-family:monospace;}
  .container{max-width:720px;margin:0 auto 28px;}
  textarea.input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px 18px;color:rgba(255,255,255,.82);font-size:14px;line-height:1.7;font-family:Georgia,serif;resize:vertical;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .left-btns{display:flex;gap:8px;}
  .icon-btn{background:rgba(255,200,80,.07);border:1px solid rgba(255,200,80,.2);border-radius:8px;color:rgba(255,200,80,.6);cursor:pointer;padding:7px 11px;font-size:13px;font-family:monospace;display:flex;align-items:center;gap:6px;}
  .go-btn{background:rgb(255,200,80);border:none;border-radius:10px;color:#1a1500;cursor:pointer;width:42px;height:38px;display:flex;align-items:center;justify-content:center;}
  .go-btn:disabled{background:rgba(255,255,255,.06);color:rgba(255,255,255,.2);cursor:not-allowed;}
  .results{max-width:720px;margin:0 auto;}
  .results-label{font-size:10px;font-family:monospace;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,200,80,.55);margin-bottom:16px;}
  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;}
  .thumb{width:70px;height:105px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,.1);flex-shrink:0;}
  .card-info{flex:1;min-width:0;}
  .card-num{font-size:9px;font-family:monospace;color:rgba(255,200,80,.5);margin-bottom:5px;letter-spacing:.12em;}
  .card-desc{font-size:12px;color:rgba(255,255,255,.55);line-height:1.5;font-family:Georgia,serif;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .dl-btn{background:rgb(255,200,80);border-radius:9px;color:#1a1500;padding:9px 16px;font-size:12px;font-weight:600;font-family:monospace;text-decoration:none;display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .spinner{animation:spin .8s linear infinite;transform-origin:center;}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .error-msg{background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.2);border-radius:10px;padding:12px 16px;color:rgba(255,120,120,.9);font-size:13px;font-family:monospace;margin-top:12px;}
  .debug{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;color:rgba(255,255,255,.35);font-size:11px;font-family:monospace;margin-top:10px;}
</style>
</head>
<body>
<div class="header">
  <div class="badge">Image Generator</div>
  <h1>Anecdote<br><span>Image Maker</span></h1>
  <p class="subtitle">2000×3000 · Cal Sans · White background</p>
</div>
<div class="container">
  <textarea class="input" id="input" rows="10" placeholder="Paste jokes separated by --- ..."></textarea>
  <div class="toolbar">
    <div class="left-btns">
      <button class="icon-btn" onclick="handlePaste()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
      </button>
      <button class="icon-btn" onclick="handleClear()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="go-btn" id="goBtn" onclick="handleExtract()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
  <div id="errorMsg" class="error-msg" style="display:none;"></div>
  <div id="debugMsg" class="debug" style="display:none;"></div>
</div>
<div class="results" id="results" style="display:none;">
  <div class="results-label" id="resultsLabel"></div>
  <div class="cards" id="cards"></div>
</div>

<script>
// ── PARSER ──────────────────────────────────────────────────────────────────
// Splits on --- regardless of what surrounds it (newlines, spaces, or nothing).
// Inside each segment finds the *description* pattern or uses the last line.
function parseJokes(raw) {
  // Normalize: \r\n → \n, \r → \n
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

  // Split on --- that appears as a standalone "word" (surrounded by any whitespace or start/end)
  // This regex handles:  \n---\n  |  ---\n  |  \n---  |  just ---  with surrounding spaces
  const segments = raw.split(/\s*\n\s*---\s*\n\s*|\s*---\s*\n|\n\s*---\s*/)
                      .map(s => s.trim()).filter(Boolean);

  // Fallback: if splitting by --- gave only 1 segment, try splitting differently
  // (handles case where --- has no newlines, e.g. "joke text---next joke")
  const finalSegments = segments.length > 1
    ? segments
    : raw.split(/---/).map(s => s.trim()).filter(Boolean);

  const jokes = [];
  for (const seg of finalSegments) {
    // Extract *description* — a line that starts with * and ends with *
    // Use the LAST such line found (in case joke text contains asterisks)
    const lines = seg.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;

    let descIdx = -1;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (/^\*.+\*$/.test(lines[i])) { descIdx = i; break; }
    }

    let description, jokeLines;
    if (descIdx !== -1) {
      description = lines[descIdx].replace(/^\*|\*$/g, '').trim();
      jokeLines   = lines.filter((_, i) => i !== descIdx);
    } else {
      // No *desc* found — last line is description
      description = lines[lines.length - 1];
      jokeLines   = lines.slice(0, -1);
    }

    const jokeText = jokeLines.join(' ').trim();
    if (jokeText) jokes.push({ jokeText, description });
  }

  return jokes;
}

// ── IMAGE GENERATOR ─────────────────────────────────────────────────────────
const IMG_W = 2000, IMG_H = 3000, PAD = 160;

async function generateImage(jokeText) {
  await document.fonts.ready;
  const canvas = document.createElement('canvas');
  canvas.width = IMG_W; canvas.height = IMG_H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, IMG_W, IMG_H);

  const maxW = IMG_W - PAD * 2;
  const maxH = IMG_H - PAD * 2;

  function wrapText(txt, size) {
    ctx.font = `${size}px 'CalSans', Georgia, sans-serif`;
    const words = txt.split(' ');
    const lines = []; let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  // Binary-search best font size
  let lo = 40, hi = 220, bestSize = lo, bestLines = wrapText(jokeText, lo);
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const lines = wrapText(jokeText, mid);
    if (lines.length * mid * 1.25 <= maxH) { bestSize = mid; bestLines = lines; lo = mid + 1; }
    else hi = mid - 1;
  }

  const lineH  = bestSize * 1.25;
  const totalH = bestLines.length * lineH;
  const startY = PAD + (maxH - totalH) / 2 + bestSize * 0.82;

  ctx.fillStyle = '#000000';
  ctx.font = `${bestSize}px 'CalSans', Georgia, sans-serif`;
  ctx.textAlign = 'center';
  bestLines.forEach((l, i) => ctx.fillText(l, IMG_W / 2, startY + i * lineH));

  return canvas.toDataURL('image/png');
}

// ── UI ──────────────────────────────────────────────────────────────────────
function updateBtn() {
  document.getElementById('goBtn').disabled = !document.getElementById('input').value.trim();
}
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = msg ? 'block' : 'none';
}
function showDebug(msg) {
  const el = document.getElementById('debugMsg');
  el.textContent = msg; el.style.display = msg ? 'block' : 'none';
}
function setLoading(on) {
  const btn = document.getElementById('goBtn');
  btn.innerHTML = on
    ? `<svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
  btn.disabled = on;
  if (!on) updateBtn();
}
async function handlePaste() {
  try {
    document.getElementById('input').value = await navigator.clipboard.readText();
    updateBtn();
  } catch { document.getElementById('input').focus(); }
}
function handleClear() {
  document.getElementById('input').value = '';
  document.getElementById('results').style.display = 'none';
  showError(''); showDebug(''); updateBtn();
}
async function handleExtract() {
  const input = document.getElementById('input').value;
  if (!input.trim()) return;
  showError(''); showDebug(''); setLoading(true);
  try {
    const jokes = parseJokes(input);

    // Debug: show how many segments were found
    showDebug(`Found ${jokes.length} jokes. Preview: ${jokes.map((j,i)=>`[${i+1}] ${j.jokeText.slice(0,30)}...`).join(' | ')}`);

    if (!jokes.length) {
      showError('No jokes found. Make sure jokes are separated by ---');
      return;
    }

    const cardsEl = document.getElementById('cards');
    cardsEl.innerHTML = '';
    document.getElementById('resultsLabel').textContent =
      jokes.length + ' image' + (jokes.length !== 1 ? 's' : '') + ' ready';
    document.getElementById('results').style.display = 'block';

    for (let i = 0; i < jokes.length; i++) {
      const { jokeText, description } = jokes[i];
      const src = await generateImage(jokeText);
      const num = String(i + 1).padStart(2, '0');
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <img class="thumb" src="${src}" alt="Joke ${num}"/>
        <div class="card-info">
          <div class="card-num">${num} · 2000×3000 PNG</div>
          <p class="card-desc">${esc(description)}</p>
        </div>
        <a class="dl-btn" href="${src}" download="joke-${num}.png">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          PNG
        </a>`;
      cardsEl.appendChild(div);
    }
  } finally { setLoading(false); }
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
document.getElementById('input').addEventListener('input', updateBtn);
</script>
</body>
</html>'''
